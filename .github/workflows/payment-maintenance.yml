name: Payment monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: payment-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure continuous BOT monitor is running
        env:
          BOT_MONITOR_SECRET: ${{ secrets.BOT_MONITOR_SECRET }}
        run: |
          test -n "$BOT_MONITOR_SECRET"
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $BOT_MONITOR_SECRET" \
            https://app.nexuspayapp.xyz/api/internal/bot-monitor/start
      - name: Reconcile submitted payments
        env:
          PAYMENT_MAINTENANCE_SECRET: ${{ secrets.PAYMENT_MAINTENANCE_SECRET }}
        run: |
          test -n "$PAYMENT_MAINTENANCE_SECRET"
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $PAYMENT_MAINTENANCE_SECRET" \
            https://nexuspay-backend-test.vercel.app/api/internal/payments/reconcile
      - name: Index confirmed BOT deposits
        if: ${{ !cancelled() }}
        env:
          PAYMENT_MAINTENANCE_SECRET: ${{ secrets.PAYMENT_MAINTENANCE_SECRET }}
        run: |
          for batch in $(seq 1 12); do
            result=$(curl --fail-with-body --silent --show-error --max-time 90 \
              -X POST \
              -H "Authorization: Bearer $PAYMENT_MAINTENANCE_SECRET" \
              https://nexuspay-backend-test.vercel.app/api/internal/payments/deposits)
            echo "$result"
            if jq -e '.data.progress.remainingBlocks == "0"' <<< "$result" > /dev/null; then
              break
            fi
          done
      - name: Deliver payment notifications
        if: ${{ !cancelled() }}
        env:
          PAYMENT_MAINTENANCE_SECRET: ${{ secrets.PAYMENT_MAINTENANCE_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $PAYMENT_MAINTENANCE_SECRET" \
            https://nexuspay-backend-test.vercel.app/api/internal/payments/notifications
