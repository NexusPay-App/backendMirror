name: Payment monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: payment-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile submitted payments
        env:
          PAYMENT_MAINTENANCE_SECRET: ${{ secrets.PAYMENT_MAINTENANCE_SECRET }}
        run: |
          test -n "$PAYMENT_MAINTENANCE_SECRET"
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $PAYMENT_MAINTENANCE_SECRET" \
            https://nexuspay-backend-test.vercel.app/api/internal/payments/reconcile
      - name: Index confirmed BOT deposits
        if: ${{ !cancelled() }}
        env:
          PAYMENT_MAINTENANCE_SECRET: ${{ secrets.PAYMENT_MAINTENANCE_SECRET }}
        run: |
          for batch in 1 2 3 4; do
            curl --fail-with-body --silent --show-error --max-time 90 \
              -X POST \
              -H "Authorization: Bearer $PAYMENT_MAINTENANCE_SECRET" \
              https://nexuspay-backend-test.vercel.app/api/internal/payments/deposits
          done
      - name: Deliver deposit notifications
        if: ${{ !cancelled() }}
        env:
          PAYMENT_MAINTENANCE_SECRET: ${{ secrets.PAYMENT_MAINTENANCE_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $PAYMENT_MAINTENANCE_SECRET" \
            https://nexuspay-backend-test.vercel.app/api/internal/payments/notifications
