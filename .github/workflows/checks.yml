name: Backend checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      security-test-db:
        image: mongo:7
        ports:
          - 27028:27017
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run check:secrets
      - run: npm ls --all
      - run: npm audit --audit-level=critical
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:security
      - run: npm ci && npm audit --audit-level=high && npm test
        working-directory: mpesa-webhook-service
      - run: npm ci && npm audit --audit-level=high && node --check server.js
        working-directory: SimpleFrontend
