name: Deploy production

# CLI fallback when Vercel Git integration is unavailable.
# Enable with repository variable ENABLE_VERCEL_CLI_DEPLOY=true and secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID=team_0hzwAkyFTPQspWt1vJ4Kx2na,
#   VERCEL_PROJECT_ID=prj_SCZLC2ZRE5iMJn5mdyJMFNIIXcIp
# Prefer native Git: connect the Vercel project to this repo, then disable this variable.

on:
  push:
    branches:
      - main
      - feat/modernize-botchain

concurrency:
  group: nexuspay-backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.ENABLE_VERCEL_CLI_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0 vercel@62.7.0
      - run: npm ci
      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
